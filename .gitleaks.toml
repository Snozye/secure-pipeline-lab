title = "Gitleaks — secure-pipeline-lab"

[extend]
useDefault = true

# Custom rule: catch generic hardcoded passwords by variable name
[[rules]]
id = "generic-password-variable"
description = "Hardcoded password in variable assignment"
regex = '''(?i)(?:password|passwd|secret|pwd)\s*(?:=|:)\s*['"][^'"]{8,}['"]'''
tags = ["generic", "password"]

# Suppress known intentional Juice Shop vulnerabilities (documented as TPs in findings/)
[[allowlists]]
description = "Intentional Juice Shop RSA keys — TP, see findings/hardcoded-jwt-key.md and findings/trivy-fp-analysis.md"
paths = [
  '''lib/insecurity\.ts''',
  '''terraform/networking\.tf''',
]

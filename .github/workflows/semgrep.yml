name: Semgrep SAST

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --config p/typescript \
            --error \
            --no-rewrite-rule-ids \
            .

name: AI Remediation Advisor

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-remediation:
    name: Analyze findings with AI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install semgrep requests

      - name: Run Semgrep scan
        run: semgrep scan --config auto --sarif --output semgrep-findings.sarif . || true

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: detect --log-opts="-1" --report-format json --report-path gitleaks-findings.json --exit-code 0

      - name: Run Trivy secrets scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: json
          output: trivy-findings.json
          exit-code: "0"

      - name: Run AI remediation analysis
        env:
          ABL_KEY: ${{ secrets.ABL_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/ai_remediation.py

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            semgrep-findings.sarif
            gitleaks-findings.json
            trivy-findings.json

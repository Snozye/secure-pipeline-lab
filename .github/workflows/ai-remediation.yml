name: AI Remediation Advisor

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-remediation:
    name: Analyze findings with Claude
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install semgrep requests

      - name: Run Semgrep scan
        # exit 0 so the workflow continues even when findings exist
        run: semgrep scan --config auto --sarif --output semgrep-findings.sarif . || true

      - name: Run AI remediation analysis
        env:
          ABL_KEY: ${{ secrets.ABL_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/ai_remediation.py

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep-findings.sarif

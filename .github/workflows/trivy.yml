name: Trivy SCA + Container

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  trivy-sca:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (filesystem / SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  trivy-container:
    name: Container image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t juice-shop:ci .

      - name: Run Trivy (container image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: juice-shop:ci
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

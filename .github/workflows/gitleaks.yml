name: Gitleaks Secrets

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gitleaks:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xf gitleaks_8.24.3_linux_x64.tar.gz gitleaks

      - name: Run Gitleaks (scan last commit)
        run: ./gitleaks detect --source . --config .gitleaks.toml --log-opts="-1" --exit-code 2 --redact -v --report-format=json --report-path=gitleaks-report.json

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

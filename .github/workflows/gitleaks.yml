name: Gitleaks Secrets

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gitleaks:
    name: Secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xf gitleaks_8.24.3_linux_x64.tar.gz gitleaks

      - name: Run Gitleaks (filesystem scan)
        run: ./gitleaks detect --source . --config .gitleaks.toml --exit-code 2 --redact

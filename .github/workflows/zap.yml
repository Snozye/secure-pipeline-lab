name: OWASP ZAP DAST

on:
  pull_request:
    branches: ["**"]

jobs:
  zap-baseline:
    name: Baseline scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Juice Shop image
        run: docker build -t juice-shop:ci .

      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 juice-shop:ci
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'
          echo "Juice Shop ready"

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: true
          allow_issue_writing: false
          rules_file_name: 'zap.rules'

      - name: Set up Python
        if: always() && github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        if: always() && github.event_name == 'pull_request'
        run: pip install requests

      - name: Post findings comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TOOL: zap
        run: python scripts/ai_remediation.py

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
